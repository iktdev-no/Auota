name: Build and Publish AUOTA

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  CI: true
  DOCKER_IMAGE: bskjon/auota

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # --- FRONTEND BUILD ---
      - name: Install frontend deps
        working-directory: ./web
        run: npm ci

      - name: Build frontend
        working-directory: ./web
        run: npm run build

      - name: Copy frontend into Spring Boot static resources
        run: |
          rm -rf src/main/resources/static
          mkdir -p src/main/resources/static
          cp -r web/dist/* src/main/resources/static/

      # --- BACKEND BUILD ---
      - name: Run tests
        run: ./gradlew test

      - name: Build JAR
        run: ./gradlew bootJar

      # --- GENERATE TAG ---
      - name: Generate date tag
        id: tag
        run: |
          DATE_TAG=$(date -u +'%Y.%m.%d')-$(echo "${GITHUB_SHA}" | cut -c1-8)
          echo "DATE_TAG=$DATE_TAG" >> $GITHUB_ENV

      # --- DOCKER LOGIN ---
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_NAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # --- DOCKER BUILD & PUSH ---
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Prod.dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ env.DATE_TAG }}
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
